<!doctype html><html lang="en"><head><meta charset="utf-8"><title>__TITLE__</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#04080f">
<!--
Motion spec (transform / opacity only, except the one-shot scorebug color and the static chain canvas):
  digit roll        560ms  cubic-bezier(.2,.8,.2,1)   60ms stagger per digit
  scoring-side bump 700ms  cubic-bezier(.34,1.56,.64,1)   scale 1 → 1.18 → 1
  light sweep       640ms  cubic-bezier(.2,.8,.2,1)   translateX across the scoring side
  marker shockwave  720ms  cubic-bezier(.2,.8,.2,1)   scale .4 → 2.6, opacity 1 → 0
  gold seal stamp   520ms  cubic-bezier(.34,1.56,.64,1)   only when receipt status is VERIFIED
  chain link slide  280ms  cubic-bezier(.34,1.56,.64,1)   one link, when playback crosses a 2s checkpoint
  chain boot        16ms stagger, 280ms spring, first paint only
  entrance          420ms  cubic-bezier(.2,.8,.2,1)   ticker 0, player 80ms, rail 160ms, panels 240ms
  FLIP into player  420ms (280ms on touch) cubic-bezier(.22,.8,.2,1)
  playhead spring   stiffness 320, damping 26, only on moment jumps; playback tracks live
  burst crossfade   160ms linear; frame hold 260ms before the read, 340ms after
  chip / marker     320ms spring
  confidence bar    600ms cubic-bezier(.2,.8,.2,1)   scaleX
  prefers-reduced-motion: no animation, no autoplay, ticker snaps, chain is static
-->
<style>
@font-face{font-family:"QorScore";src:url("../../assets/fonts/barlow-condensed-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap;unicode-range:U+20,U+2D,U+30-39,U+2013-2014}
:root{--bg:#04080f;--panel:#0b1424;--line:rgba(130,170,210,.16);--line2:rgba(130,170,210,.28);
--ink:#e7eef8;--mute:#8b9bb0;--dim:#5d6d84;--aqua:#3fe0d0;--aqua2:#1aa89b;--steel:#9fb2cc;--gold:#f0c95c;--warn:#f0a06a;--bad:#ff6d6d;
--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--flip:cubic-bezier(.22,.8,.2,1);
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--score:"QorScore","Arial Narrow","Helvetica Neue",sans-serif;
--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;max-width:100%;overflow-x:hidden}
body{margin:0;max-width:100%;background:
 radial-gradient(70% 46% at 80% -8%, rgba(24,58,92,.5), transparent 55%),
 radial-gradient(50% 36% at 0% 100%, rgba(14,48,52,.4), transparent 50%),
 #04080f;color:var(--ink);font:13.5px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;opacity:.22;
 background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, transparent 1px 4px);mix-blend-mode:overlay}
a{color:var(--aqua)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono)}
.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:650}
.sub{color:var(--dim);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.tag.a{color:var(--aqua);border-color:rgba(63,224,208,.45)}.tag.g{color:var(--gold);border-color:rgba(240,201,92,.55)}.tag.w{color:var(--warn);border-color:rgba(240,160,106,.5)}.tag.x{color:var(--bad);border-color:rgba(255,109,109,.55)}
.miss{color:var(--warn);font-style:italic}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.btn{border:1px solid var(--line2);border-radius:99px;padding:8px 12px;min-height:44px;color:var(--aqua);font-size:12.5px}
.btn:hover{border-color:var(--aqua)}.btn.round{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:22px;line-height:1}

.enter{opacity:0;transform:translateY(12px)}
body.ready .enter{opacity:1;transform:none;transition:opacity 420ms var(--ease),transform 420ms var(--ease)}
body.ready .d1{transition-delay:80ms}body.ready .d2{transition-delay:160ms}body.ready .d3{transition-delay:240ms}
/* sticky broadcast header */
.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:minmax(140px,1fr) auto minmax(140px,1fr);align-items:center;gap:12px;

.ticker::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--steel),var(--aqua))}

.ticker .away{justify-content:flex-start}.ticker .home{justify-content:flex-end}
.ticker .nm{font-size:10px;letter-spacing:.18em;color:var(--mute)}
.ticker .dg{font:700 42px/1 var(--score);letter-spacing:.01em;color:var(--aqua);display:inline-flex}
.ticker .away .dg{color:var(--steel)}
.ticker .ctr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 12px 8px;background:rgba(0,0,0,.28);min-width:72px}
.ticker .q{font:11px var(--mono);letter-spacing:.14em;color:var(--mute)}
.ticker .clk{font:600 16px/1.1 var(--mono);color:var(--ink)}

.status.fail{border-color:rgba(255,109,109,.6);color:var(--bad)}.status.ok{border-color:rgba(240,201,92,.6);color:var(--gold)}
.seal{position:absolute;right:8px;top:6px;z-index:2;font-size:9px;letter-spacing:.16em;color:var(--gold);border:1px solid rgba(240,201,92,.7);background:#140f04;border-radius:99px;padding:2px 6px;opacity:0}
.seal.go{animation:stamp 520ms var(--spring) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(1.4) rotate(-8deg)}100%{opacity:1;transform:none}}
.col{display:inline-block;height:1em;overflow:hidden;line-height:1}
.col i{display:block;font-style:normal;transition:transform 560ms var(--ease);will-change:transform}
.col i b{display:block;height:1em;font-weight:inherit;text-align:center}
.bump{animation:bump 700ms var(--spring)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.18)}100%{transform:scale(1)}}
.sweep{position:absolute;top:0;bottom:0;width:46%;left:0;pointer-events:none;opacity:0;transform:translateX(-140%);
 background:linear-gradient(90deg,transparent,rgba(220,255,250,.5),transparent)}
.side.hot .sweep{animation:sweep 640ms var(--ease)}
@keyframes sweep{0%{opacity:0;transform:translateX(-140%)}18%{opacity:1}100%{opacity:0;transform:translateX(250%)}}

.grid{display:grid;gap:14px;max-width:1440px;margin:0 auto;padding:14px clamp(12px,2.2vw,28px) 36px;min-width:0;
 grid-template-columns:minmax(0,1fr) 372px;grid-template-areas:"stage side" "rail side" "clips clips" "foot foot"}
.stage-card{grid-area:stage;position:relative;background:transparent;border:0;padding:0;box-shadow:none;min-width:0}
.rail-card{grid-area:rail;min-width:0}.side-col{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
.clips-card{grid-area:clips;min-width:0}.foot{grid-area:foot;min-width:0}
.bleed{position:absolute;z-index:0;left:6%;right:6%;top:8%;height:62%;pointer-events:none;
 background:radial-gradient(55% 70% at 50% 40%, var(--bleed, transparent), transparent 72%)}
.stage,.ctl,.aisaw{position:relative;z-index:1}
.stage{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#02050a;border:1px solid var(--line);contain:layout paint;touch-action:pan-y}
.stage .fr,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}

.burn{position:absolute;z-index:4;left:0.8%;top:1.4%;width:56%;min-height:20%;background:#081122;border-left:2px solid var(--aqua);

.burn b{font-size:9px;letter-spacing:.14em;color:var(--aqua);font-weight:700}

.mode{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:rgba(4,8,15,.82);border:1px solid var(--line2)}
.mode.clip{border-color:rgba(63,224,208,.5);color:var(--aqua)}
.dt{font:700 15px var(--mono);padding:1px 7px;border-radius:7px;background:rgba(4,8,15,.72)}
.dt.zero{color:var(--aqua)}
.readpop{position:absolute;z-index:3;right:8px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
 background:rgba(4,8,15,.86);border:1px solid rgba(63,224,208,.45);border-radius:10px;padding:6px 10px;pointer-events:none}
.readpop b{color:var(--aqua);font-weight:650;font-size:12px}.readpop span{font:11px var(--mono);color:var(--mute)}

.ctl{display:flex;align-items:center;gap:8px;margin-top:8px}
.prog{position:relative;flex:1;height:44px;display:flex;align-items:center;cursor:pointer;touch-action:pan-y}
.prog .bar{position:relative;height:4px;width:100%;border-radius:4px;background:var(--line2);overflow:hidden}

.pos{color:var(--mute);min-width:72px;text-align:right;font:12px var(--mono)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;max-width:100%;min-width:0}
.strip button{flex:0 0 auto;width:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);opacity:.55;position:relative;transition:opacity 160ms,transform 320ms var(--spring)}
.strip button img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#02050a}
.strip button span{position:absolute;right:3px;bottom:1px;font:10px var(--mono);text-shadow:0 1px 2px #000}
.strip button.on{opacity:1;border-color:var(--aqua);transform:translateY(-3px)}
.strip button.z span{color:var(--aqua);font-weight:700}
.strip button.z::after{content:"read";position:absolute;left:3px;top:1px;font:9px var(--mono);color:var(--aqua);text-shadow:0 1px 2px #000}
/* proof chain + score worm */
.chainClip{overflow:hidden;height:34px;display:flex;justify-content:center;margin:2px 0 6px;width:100%;min-width:0;max-width:100%}
.chainWin{display:flex;height:34px;will-change:transform}
.chainClip:not(.booted) .link{opacity:0;transform:translateY(-10px)}
.chainClip.booted .link{transition:transform 280ms var(--spring),opacity 220ms var(--ease)}
.link{width:32px;flex:0 0 32px;display:flex;align-items:center;color:var(--steel);opacity:.95}
.link .pin{width:7px;height:7px;border:1.5px solid currentColor;border-radius:50%;flex:none}
.link .bar{flex:1;height:2px;background:currentColor;margin:0 -1px}
.link.future{transform:translateY(-6px);opacity:.38}
.link.now{color:var(--aqua)}
.link.now .pin{transform:scale(1.25)}
.link .pin{transition:transform 280ms var(--spring)}
.link.crack{color:var(--bad)}
.link.crack .bar{background:linear-gradient(90deg,currentColor 0 34%,transparent 34% 66%,currentColor 66%);transform:rotate(-16deg) scaleX(.55)}
.link.pad{opacity:0}
.rail-card.seal .link.past{color:var(--aqua)}
.rail-card.seal .link.crack{color:var(--bad)}
.tl{position:relative;margin-top:2px;min-width:0;max-width:100%}
.macro{position:relative;height:28px}
.crackbtns{position:absolute;inset:0;z-index:3}
.crackbtn{position:absolute;top:0;left:0;width:44px;height:44px;margin:-8px 0 0 -22px;display:grid;place-items:center}
.crackbtn i{width:3px;height:18px;border-radius:1px;background:var(--bad);box-shadow:0 0 0 3px rgba(255,109,109,.3)}
#rail{display:block;width:100%;height:28px}

.ph i{position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--aqua) 18%,var(--aqua) 82%,transparent)}
.worm-wrap{position:relative;height:132px;min-width:0;max-width:100%}

.mks{position:absolute;inset:0}
.mk{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center}
.mk::before{content:"";width:11px;height:11px;border-radius:50%;border:2px solid currentColor;background:#04080f;transition:transform 320ms var(--spring)}

.qlab{position:absolute;top:2px;font:10px var(--mono);color:var(--dim);pointer-events:none}

@keyframes shock{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}

.nav{margin-left:auto;display:flex;gap:6px}

.big{font:700 64px/0.9 var(--score);letter-spacing:.02em;display:flex;align-items:baseline;gap:.12em}

.big.g .away,.big.g .home{color:var(--gold)}

 .strip button{width:84px}
 .cgrid{display:flex;overflow-x:auto;grid-template-columns:none;scroll-snap-type:x mandatory}

}
@media (pointer:coarse){body::before{display:none}}

 *,*::before,*::after{animation:none!important;transition:none!important}

<script>
(()=>{"use strict";
const D=__DATA__;
const $=s=>document.querySelector(s);
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const COARSE=matchMedia("(pointer:coarse)").matches;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nil=x=>x===null||x===undefined;
const MISS='<span class="miss">missing</span>';
const v=x=>nil(x)?MISS:esc(x);
const clk=s=>nil(s)?"–:––":`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const mmss=s=>nil(s)?"–":`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const sc=s=>s&&!nil(s.away)&&!nil(s.home)?`${s.away}–${s.home}`:null;
const short=h=>h?esc(String(h).slice(0,12))+"…":MISS;
const EV=Array.isArray(D.events)?D.events:[];
const P0=D.publish||{};
const RCPT=P0.receipt||{};
const STATUS=RCPT.status||"";
const VERIFIED=STATUS==="VERIFIED";
const CL=Array.isArray(P0.highlights)?P0.highlights:[];
const CH=D.chain||{};
const IS=D.input_summary||{};
const VD=D.video||{};
function winCount(){const w=$("#chainClip").clientWidth||320;let n=Math.max(5,Math.min(COARSE?9:17,Math.floor(w/32)));if(n%2===0)n-=1;return n}
let RAIL=P0.chain_rail||null;
let CRACKS=new Set();
let DUR=1,MAXS=1,NAV=[],sel=-1;
const S={mode:"burst",i:0,z:0,timer:0,raf:0,ev:null,clip:null,fr:[],shown:false,ci:null,booted:RM,flip:null,win:0};
const vid=$("#vid"),frA=$("#frA"),frB=$("#frB");
let front=frA;

/* ---------- digits ---------- */
function digits(el,n,animate){const s=nil(n)?"–":String(n);
 if(el.dataset.len!==String(s.length)||s==="–"){el.innerHTML=s==="–"?"–":[...s].map(()=>`<span class="col"><i>${[...Array(10).keys()].map(d=>`<b>${d}</b>`).join("")}</i></span>`).join("");el.dataset.len=s.length;animate=false}
 if(s==="–")return;
 [...el.querySelectorAll("i")].forEach((i,k)=>{const y=`translateY(-${s[k]}em)`;
  if(!animate||RM){i.style.transition="none";i.style.transform=y;i.getBoundingClientRect();i.style.transition=""}
  else{i.style.transitionDelay=`${k*60}ms`;i.style.transform=y}})}
function ticker(score,ev,animate){const a=score?score.away:null,h=score?score.home:null;
 const pa=$("#tA").dataset.v,ph=$("#tH").dataset.v;
 digits($("#tA"),a,animate);digits($("#tH"),h,animate);
 if(animate&&!RM){if(pa!==undefined&&String(a)!==pa)$("#tA").classList.remove("bump"),void $("#tA").offsetWidth,$("#tA").classList.add("bump");
  if(ph!==undefined&&String(h)!==ph)$("#tH").classList.remove("bump"),void $("#tH").offsetWidth,$("#tH").classList.add("bump")}
 $("#tA").dataset.v=nil(a)?"":String(a);$("#tH").dataset.v=nil(h)?"":String(h);
 $("#tQ").textContent=ev&&!nil(ev.quarter)?"Q"+ev.quarter:"Q–";
 $("#tC").textContent=ev?clk(ev.clock_s):"–:––"}
function tstate(ev,after){const gold=VERIFIED&&after&&ev&&ev.locked===true;
 $("#ticker").classList.toggle("gold",!!gold);
 const st=$("#tState");
 if(!ev||!ev.score_before){st.textContent=ev?"opening read":"";return}
 st.textContent=gold?"locked · verified":after?"scorebug read · not a verified result":"before the read"}
function pulse(side){if(RM)return;const el=side==="away"?$("#sideA"):$("#sideH");el.classList.remove("hot");void el.offsetWidth;el.classList.add("hot")}
function shockAt(ev){if(RM||!ev)return;const wrap=$("#wormWrap");const x=X(ev.recording_s)*wrap.clientWidth;
 const side=ev.delta&&ev.delta.away>0?"away":"home";
 const y=(ev.score_after?Y(ev.score_after[side]||0):0.5)*wrap.clientHeight;
 const s=$("#shock");s.style.transform=`translate(${x}px,${y}px)`;s.classList.remove("go");void s.offsetWidth;s.classList.add("go")}
function stamp(){if(!(VERIFIED&&S.ev&&S.ev.locked===true)||RM)return;const s=$("#seal");s.hidden=false;s.classList.remove("go");void s.offsetWidth;s.classList.add("go")}
function showRead(on,ev){const el=$("#readMsg");if(!on||!ev||!ev.score_before){el.hidden=true;return}
 $("#readSub").textContent=`${sc(ev.score_before)} → ${sc(ev.score_after)}${ev.reads_agreeing?` · held ${ev.reads_agreeing} reads`:""}`;
 el.hidden=false;if(RM)return;el.classList.remove("go");void el.offsetWidth;el.classList.add("go")}
function cross(on,animate){const ev=S.ev;if(!ev)return;if(on===S.shown)return;S.shown=on;
 const after=on&&ev.score_before;
 ticker(after?ev.score_after:(ev.score_before||ev.score_after),ev,animate&&!!ev.score_before);
 tstate(ev,after||!ev.score_before);
 if(after&&animate){const side=ev.delta&&ev.delta.away>0?"away":"home";pulse(side);shockAt(ev);
  const f=$("#flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");showRead(true,ev);stamp()}
 else showRead(false)}

/* ---------- chain ---------- */
function sparseRail(){const map=new Map();
 EV.forEach(e=>{const ck=e.checkpoints||{};["before","after","trigger_match"].forEach(k=>{const c=ck[k];
  if(!c||nil(c.seq)||nil(e.recording_s))return;const crack=c.frames_hash_matches_evidence===false;
  const prev=map.get(c.seq);if(!prev)map.set(c.seq,{seq:c.seq,rec:+e.recording_s,crack,why:crack?"frames_hash mismatch":""});else if(crack){prev.crack=true;prev.why="frames_hash mismatch"}})});
 const rows=[...map.values()].sort((a,b)=>a.rec-b.rec);if(rows.length<2)return null;
 return {n:rows.length,dt_s:null,t0_s:rows[0].rec,t1_s:rows[rows.length-1].rec,times:rows.map(r=>r.rec),
  cracks:rows.map((r,i)=>r.crack?{i,why:r.why}:null).filter(Boolean),seal:false,sparse:true,
  note:"Checkpoints bound to these moments. The full 2-second chain was not published with this page, so this rail is not a seal."}}
function linkTime(i){if(!RAIL)return 0;if(RAIL.times)return RAIL.times[Math.max(0,Math.min(RAIL.times.length-1,i))]||0;
 if(RAIL.n<=1)return RAIL.t0_s||0;return RAIL.t0_s+(RAIL.t1_s-RAIL.t0_s)*i/(RAIL.n-1)}
function linkAt(rec){if(!RAIL||nil(rec))return -1;if(RAIL.times){let b=0,bd=1e9;RAIL.times.forEach((t,i)=>{const d=Math.abs(t-rec);if(d<bd){bd=d;b=i}});return b}
 if(rec<=RAIL.t0_s)return 0;if(rec>=RAIL.t1_s)return RAIL.n-1;
 return Math.round((rec-RAIL.t0_s)/(RAIL.t1_s-RAIL.t0_s)*(RAIL.n-1))}
function paintLinks(i,settle){const WIN=winCount();S.win=WIN;const half=(WIN-1)>>1;let html="";
 for(let k=-half;k<=half;k++){const j=i+k,inside=j>=0&&j<RAIL.n,crack=inside&&CRACKS.has(j);
  const cls=!inside?"pad":crack?"crack "+(k<0?"past":k>0?"future":"now"):k<0?"past":k>0?"future":"now";
  html+=`<span class="link ${cls}"><i class="pin"></i><i class="bar"></i><i class="pin"></i></span>`}
 const win=$("#chainWin");win.innerHTML=html;
 if(!S.booted||settle){S.booted=true;const clip=$("#chainClip");if(RM)clip.classList.add("booted");else{clip.classList.remove("booted");[...win.children].forEach((el,k)=>el.style.transitionDelay=`${k*16}ms`);
  requestAnimationFrame(()=>{clip.classList.add("booted");setTimeout(()=>win.querySelectorAll(".link").forEach(el=>el.style.transitionDelay=""),700)})}}}
let chainToken=0;
function slideChain(dir,i){const win=$("#chainWin"),token=++chainToken;let done=false;
 const finish=()=>{if(done||token!==chainToken)return;done=true;win.style.transition="none";win.style.transform="none";paintLinks(i)};
 win.style.transition="transform 280ms var(--spring)".replace("var(--spring)","cubic-bezier(.34,1.56,.64,1)");
 win.style.transform=`translateX(${dir*32}px)`;
 win.addEventListener("transitionend",finish,{once:true});setTimeout(finish,400)}
function renderChain(rec,animate){if(!RAIL){$("#chainClip").hidden=true;return}$("#chainClip").hidden=false;
 const i=linkAt(rec);if(i<0)return;if(S.ci===i&&$("#chainWin").childElementCount)return;const prev=S.ci;S.ci=i;
 if(animate&&!RM&&prev!=null&&Math.abs(i-prev)===1&&$("#chainWin").childElementCount){slideChain(prev-i,i);return}
 chainToken++;paintLinks(i)}
function drawMacro(){if(!RAIL)return;const c=$("#rail"),w=c.clientWidth||600,h=28;const dpr=Math.min(2,devicePixelRatio||1);
 c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 g.strokeStyle=RAIL.seal?"rgba(63,224,208,.45)":"rgba(159,178,204,.45)";g.lineWidth=1.4;g.beginPath();g.moveTo(6,h/2);g.lineTo(w-6,h/2);g.stroke();
 const n=RAIL.n,step=n>220?Math.ceil(n/160):1;
 g.lineWidth=1.3;g.strokeStyle=RAIL.seal?"rgba(63,224,208,.85)":"rgba(159,178,204,.8)";
 for(let i=0;i<n;i+=step){if(CRACKS.has(i))continue;const px=X(linkTime(i))*w;const half=Math.max(1.2,Math.min(7,(w/Math.max(1,n/step))*0.28));
  g.beginPath();g.moveTo(px-half,h/2);g.lineTo(px+half,h/2);g.stroke()}
 g.strokeStyle="#04080f";g.lineWidth=8;
 (RAIL.cracks||[]).forEach(cr=>{const px=X(linkTime(cr.i))*w;g.beginPath();g.moveTo(px-7,h/2);g.lineTo(px+7,h/2);g.stroke()});
 g.strokeStyle="#ff6d6d";g.lineWidth=1.6;
 (RAIL.cracks||[]).forEach(cr=>{const px=X(linkTime(cr.i))*w;
  g.beginPath();g.moveTo(px-5,h/2-5);g.lineTo(px+4,h/2+5);g.stroke();
  g.beginPath();g.moveTo(px+5,h/2-5);g.lineTo(px-4,h/2+5);g.stroke()});
 placeCracks()}
function placeCracks(){const host=$("#crackBtns");if(!host||!RAIL)return;const w=$("#rail").clientWidth||1;const groups=[];
 for(const c of (RAIL.cracks||[])){const prev=groups[groups.length-1];
  if(prev&&c.i-prev.last<=3){prev.last=c.i;prev.why.push("#"+c.i+" "+c.why);prev.ids.push(c.i)}
  else groups.push({last:c.i,why:["#"+c.i+" "+c.why],ids:[c.i]})}
 host.innerHTML=groups.map(g=>{const mid=g.ids[(g.ids.length-1)>>1];const x=X(linkTime(mid))*w;
  return `<button type="button" class="crackbtn" style="transform:translateX(${x.toFixed(1)}px)" data-i="${mid}" aria-label="Show cracked link ${esc(g.why.join(", "))}"><i></i></button>`}).join("");
 host.querySelectorAll("button").forEach(b=>b.onclick=ev=>{ev.stopPropagation();focusCrack(+b.dataset.i)})}
function focusCrack(i){pause();const t=linkTime(i);S.ci=null;setRec(t,true);paintLinks(linkAt(t),true);
 document.querySelectorAll(".crackbtn").forEach(b=>b.classList.toggle("on",+b.dataset.i===i))}

/* ---------- worm ---------- */
const X=t=>Math.max(0,Math.min(1,(t||0)/DUR));
const Y=s=>1-(s/MAXS)*.82-.06;
const PH={x:0,v:0,target:0,raf:0};
function paintPH(){const w=$("#tl").clientWidth||1;$("#ph").style.transform=`translateX(${PH.x*w}px)`;
 const r=$("#rvr");if(r)r.setAttribute("width",(PH.x*1000).toFixed(1))}
function setRec(rec,live){PH.target=X(rec);
 if(live||RM){PH.x=PH.target;PH.v=0;if(PH.raf){cancelAnimationFrame(PH.raf);PH.raf=0}paintPH();renderChain(rec,!!live&&!RM);return}
 const step=()=>{const dt=1/60,a=-320*(PH.x-PH.target)-26*PH.v;PH.v+=a*dt;PH.x+=PH.v*dt;paintPH();renderChain(PH.x*DUR,true);
  if(Math.abs(PH.v)>0.0004||Math.abs(PH.x-PH.target)>0.0004)PH.raf=requestAnimationFrame(step);
  else{PH.x=PH.target;PH.v=0;paintPH();PH.raf=0}};
 if(!PH.raf)PH.raf=requestAnimationFrame(step)}
function drawWorm(){const svg=$("#worm");svg.setAttribute("viewBox","0 0 1000 100");
 const pts={away:[[0,0]],home:[[0,0]]};
 EV.forEach(e=>{if(!e.score_after||nil(e.recording_s))return;["away","home"].forEach(s=>{const last=pts[s][pts[s].length-1];
  if(e.score_after[s]!==last[1]){pts[s].push([e.recording_s,last[1]],[e.recording_s,e.score_after[s]])}})});
 const path=s=>pts[s].concat([[DUR,pts[s][pts[s].length-1][1]]]).map(([t,y],k)=>`${k?"L":"M"}${(X(t)*1000).toFixed(1)} ${(Y(y)*100).toFixed(2)}`).join("");
 let g='<defs><clipPath id="rv"><rect id="rvr" x="0" y="-5" width="0" height="110"/></clipPath></defs>';
 EV.forEach(e=>{if(e.kind!=="quarter_change"||nil(e.recording_s))return;const x=X(e.recording_s)*1000;g+=`<line class="qline" x1="${x}" x2="${x}" y1="0" y2="100" vector-effect="non-scaling-stroke"/>`});
 g+=`<path class="ln a ghost" d="${path("away")}"/><path class="ln h ghost" d="${path("home")}"/><g clip-path="url(#rv)"><path class="ln a" d="${path("away")}"/><path class="ln h" d="${path("home")}"/></g>`;
 svg.innerHTML=g;const mk=$("#mks");mk.innerHTML="";
 EV.forEach((e,i)=>{if(nil(e.recording_s))return;
  if(e.kind==="quarter_change"){const q=document.createElement("span");q.className="qlab";q.textContent="Q"+(e.quarter??"?");q.dataset.i=i;mk.appendChild(q);return}
  if(!NAV.includes(i))return;const side=e.delta&&e.delta.away>0?"a":"h";const gold=VERIFIED&&e.locked===true;
  const b=document.createElement("button");b.className=`mk ${gold?"g":side}`;b.dataset.i=i;
  b.setAttribute("aria-label",`${e.kind.replace(/_/g," ")} ${sc(e.score_after)||""} Q${e.quarter??"?"} ${clk(e.clock_s)}`);
  b.innerHTML=`<span class="t">${esc(sc(e.score_after)||e.kind.replace(/_/g," "))}</span>`;
  b.onclick=ev=>{ev.stopPropagation();S.flip=b;select(i)};mk.appendChild(b)});
 placeMarkers()}
function placeMarkers(){const W=$("#wormWrap").clientWidth,H=$("#wormWrap").clientHeight;
 document.querySelectorAll("#mks .mk").forEach(b=>{const e=EV[+b.dataset.i];const side=e.delta&&e.delta.away>0?"away":"home";
  const y=e.score_after?Y(e.score_after[side]||0):Y(0);b.style.transform=`translate(${X(e.recording_s)*W}px,${y*H}px)`});
 document.querySelectorAll("#mks .qlab").forEach(q=>{q.style.transform=`translateX(${X(EV[+q.dataset.i].recording_s)*W}px)`})}
function chips(){const c=$("#chips");
 c.innerHTML=NAV.map(i=>{const e=EV[i];const gold=VERIFIED&&e.locked===true;
  const nm=e.kind==="score_change"?(e.play||"score").replace(/\s*\(.*\)/,""):e.kind.replace(/_/g," ");
  return `<button class="chip ${gold?"g":""}" role="option" data-i="${i}"><span class="s">${esc(sc(e.score_after)||"—")}</span>${!nil(e.highlight)?'<span class="c">▶ clip</span>':""}<span class="m">Q${v(e.quarter)} ${clk(e.clock_s)} · ${esc(nm)}</span></button>`}).join("");
 c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.flip=b;select(+b.dataset.i)})}
function hscroll(box,el){if(!box||!el)return;const l=el.offsetLeft-(box.clientWidth-el.clientWidth)/2;box.scrollTo({left:Math.max(0,l),behavior:RM?"auto":"smooth"})}

/* ---------- stage ---------- */
function zeroIdx(fr){let b=0,bd=1e9;fr.forEach((f,k)=>{const d=Math.abs(f.dt_s||0);if(d<bd){bd=d;b=k}});return b}
function icon(on){$("#pico").setAttribute("d",on?"M2 1h3v10H2zM7 1h3v10H7z":"M2 1l9 5-9 5z");$("#play").setAttribute("aria-label",on?"Pause":"Play")}
function pause(){clearInterval(S.timer);S.timer=0;cancelAnimationFrame(S.raf);S.raf=0;if(!vid.hidden)vid.pause();icon(false)}
function burn(c){const el=$("#burn");if(S.mode!=="clip"||!c){el.hidden=true;return}
 const lk=c.lock||{},seal=VERIFIED&&c.locked===true,head=c.overlay_label||(seal?"LOCKED SCORE":"SCOREBUG LOCK");
 const sa=lk.score_after||{};el.hidden=false;el.classList.toggle("seal",seal);
 el.innerHTML=`<b>${esc(head)}</b><span class="sc">AWAY ${esc(nil(sa.away)?"?":sa.away)} – HOME ${esc(nil(sa.home)?"?":sa.home)} · Q${esc(nil(lk.quarter)?"?":lk.quarter)} ${esc(clk(lk.clock_s))}</span><span class="meta">lock #${esc(nil(lk.seq)?"?":lk.seq)} ${esc(String(lk.hash||"").slice(0,12))} · receipt ${esc(STATUS||"?")}</span>`}
function showFrame(k,anim){const fr=S.fr;if(!fr||!fr.length)return;k=Math.max(0,Math.min(fr.length-1,k));S.i=k;const f=fr[k];
 const back=front===frA?frB:frA;back.alt=`burst frame ${k+1} of ${fr.length}, ${f.dt_s}s from the read`;
 const swap=()=>{back.classList.add("on");front.classList.remove("on");front=back;bleedFrom(back)};
 if(back.getAttribute("src")===f.src)swap();else{back.onload=swap;back.src=f.src}
 const z=Math.abs(+f.dt_s)<0.35;$("#dt").textContent=`${f.dt_s>=0?"+":""}${(+f.dt_s).toFixed(1)}s`;$("#dt").classList.toggle("zero",z);
 $("#pos").textContent=`${k+1}/${fr.length}`;$("#progFill").style.transform=`scaleX(${k/Math.max(1,fr.length-1)})`;
 $("#prog").setAttribute("aria-valuenow",String(Math.round(100*k/Math.max(1,fr.length-1))));
 document.querySelectorAll("#strip button").forEach((b,j)=>b.classList.toggle("on",j===k));
 const sb=document.querySelectorAll("#strip button")[k];if(sb)hscroll($("#strip"),sb);
 const rec=nil(f.recording_s)?f.video_s:f.recording_s;setRec(rec,true);cross(k>=S.z,anim)}
function play(){if(S.mode==="clip"){vid.play().then(loopV).catch(()=>{});icon(true);return}
 if(!S.fr||!S.fr.length)return;clearInterval(S.timer);if(S.i>=S.fr.length-1)showFrame(0,false);icon(true);
 const tick=()=>{if(S.i>=S.fr.length-1){pause();return}showFrame(S.i+1,true)};
 S.timer=setInterval(tick,S.i<S.z?260:340)}
function vtime(t){const c=S.clip;if(!c)return;const d=c.duration_s||vid.duration||1;
 $("#progFill").style.transform=`scaleX(${Math.min(1,t/d)})`;$("#pos").textContent=`${t.toFixed(1)}/${(+d).toFixed(0)}s`;
 const rel=t-(c.lock_at_s||0);$("#dt").textContent=`${rel>=0?"+":""}${rel.toFixed(1)}s`;$("#dt").classList.toggle("zero",Math.abs(rel)<0.35);
 const start=nil(c.source_start_s)?(S.ev&&S.ev.recording_s||0)-(c.lock_at_s||0):c.source_start_s;
 setRec(start+t,true);cross(t>=(c.lock_at_s||0),true);
 if(!S.bleedAt||performance.now()-S.bleedAt>900){S.bleedAt=performance.now();bleedFrom(vid)}}
function loopV(){icon(true);cancelAnimationFrame(S.raf);const f=()=>{if(vid.paused||vid.ended){icon(false);return}vtime(vid.currentTime||0);S.raf=requestAnimationFrame(f)};S.raf=requestAnimationFrame(f)}
vid.addEventListener("seeked",()=>{if(S.mode==="clip")vtime(vid.currentTime||0)});
vid.addEventListener("loadeddata",()=>bleedFrom(vid));
vid.addEventListener("ended",()=>icon(false));
function load(mode,first){pause();S.mode=mode;S.shown=false;const e=S.ev;const c=S.clip;
 ticker(e.score_before||e.score_after,e,false);tstate(e,!e.score_before);S.shown=!e.score_before;
 $("#readMsg").hidden=true;$("#empty").hidden=true;$("#srcBtn").hidden=!c;
 $("#srcBtn").textContent=mode==="clip"?"Show burst stills":"Show clip";
 $("#srcBtn").onclick=()=>load(S.mode==="clip"?"burst":"clip",false);
 const md=$("#mode");
 if(mode==="clip"&&c){vid.hidden=false;frA.classList.remove("on");frB.classList.remove("on");
  if(vid.getAttribute("src")!==c.url){vid.src=c.url;if(c.poster)vid.poster=c.poster;vid.preload="auto"}
  md.className="mode clip";md.innerHTML=`Highlight clip · ${esc(c.duration_s)}s<span class="lng"> · re-encoded from hash-chained video</span>`;
  $("#lockPin").style.left=((c.lock_at_s||0)/(c.duration_s||1)*100)+"%";$("#lockPin").classList.toggle("g",VERIFIED&&c.locked===true);
  burn(c);const start=nil(c.source_start_s)?(e.recording_s||0)-(c.lock_at_s||0):c.source_start_s;setRec(start,first||RM);
  const arm=()=>{try{vid.currentTime=0}catch(err){}vtime(0);if(!RM)vid.play().then(loopV).catch(()=>{})};
  if(vid.readyState>=1)arm();else vid.addEventListener("loadedmetadata",arm,{once:true});
  if(S.flip){const from=S.flip;S.flip=null;requestAnimationFrame(()=>flip(from))}}
 else{vid.pause();vid.hidden=true;burn(null);const fr=(e.frames||[]).filter(f=>f.src);S.fr=fr;
  if(!fr.length){md.className="mode";md.textContent="no burst frames";$("#empty").hidden=false;
   $("#empty").innerHTML=`<div><div class="lbl">no frames</div><span class="miss">${esc(e.frames_missing_reason||"missing in bundle")}</span></div>`;
   setRec(e.recording_s,true);return}
  const span=(fr[fr.length-1].video_s||0)-(fr[0].video_s||0);
  md.className="mode";md.innerHTML=`Burst stills · ${fr.length} frames / ${Math.max(0,span).toFixed(0)}s<span class="lng"> · not continuous video</span>`;
  const z=zeroIdx(fr);S.z=z;$("#lockPin").style.left=(z/Math.max(1,fr.length-1)*100)+"%";$("#lockPin").classList.toggle("g",false);
  showFrame(RM?z:0,false);if(!RM)setTimeout(()=>{if(S.mode==="burst"&&S.ev===e)play()},first?420:220);
  if(S.flip){const from=S.flip;S.flip=null;requestAnimationFrame(()=>flip(from))}}}
function flip(from){if(RM||!from||!from.getBoundingClientRect)return;const stage=$("#stage");
 const a=from.getBoundingClientRect(),b=stage.getBoundingClientRect();
 if(a.width<8||b.width<8||b.bottom<0||b.top>innerHeight)return;
 const dx=a.left-b.left,dy=a.top-b.top,sx=a.width/b.width,sy=a.height/b.height;
 stage.style.transformOrigin="0 0";stage.style.transition="none";stage.style.transform=`translate(${dx}px,${dy}px) scale(${sx},${sy})`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{stage.style.transition=`transform ${COARSE?280:420}ms cubic-bezier(.22,.8,.2,1)`;stage.style.transform="none"}))}
const samp=document.createElement("canvas");samp.width=8;samp.height=8;const sx=samp.getContext("2d",{willReadFrequently:true});
function bleedFrom(src){try{sx.drawImage(src,0,0,8,8);const d=sx.getImageData(0,0,8,8).data;let r=0,g=0,b=0,n=0;
 for(let i=0;i<d.length;i+=4){if(d[i]+d[i+1]+d[i+2]<48)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}
 if(!n)return;document.documentElement.style.setProperty("--bleed",`rgba(${r/n|0},${g/n|0},${b/n|0},.5)`)}catch(e){}}
function strip(e){const fr=(e.frames||[]).filter(f=>f.src);const z=zeroIdx(fr);
 $("#aiSub").textContent=fr.length?`${fr.length} frames the score reader looked at${e.reads_agreeing?` · new score held ${e.reads_agreeing} consecutive reads`:""}. Per-frame digits are not in this bundle.`:"no burst frames in this bundle";
 $("#strip").innerHTML=fr.map((f,k)=>`<button class="${k===z?"z":""}" data-k="${k}" aria-label="frame ${k+1}, ${f.dt_s}s from the read"><img loading="lazy" decoding="async" alt="" src="${esc(f.thumb||f.src)}"><span>${f.dt_s>=0?"+":""}${(+f.dt_s).toFixed(1)}</span></button>`).join("");
 $("#strip").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(S.mode!=="burst")load("burst",false);pause();showFrame(+b.dataset.k,true)})}
function preloadNext(i){const k=NAV.indexOf(i);const n=EV[NAV[k+1]];const f=n&&(n.frames||[]).find(x=>x.src);if(f){const im=new Image();im.decoding="async";im.src=f.thumb||f.src}}

/* ---------- cards ---------- */
function evCard(e){const a=e.score_after||{},gold=VERIFIED&&e.locked===true;
 const wall=nil(e.t_ms)?MISS:esc(new Date(e.t_ms).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",second:"2-digit",timeZoneName:"short"}));
 $("#evCard").innerHTML=`<div class="h"><span class="lbl">${esc((e.kind||"").replace(/_/g," "))}</span>${gold?'<span class="tag g">referee-verified lock</span>':'<span class="tag a">read · not a verified result</span>'}${e.legal_step===false?'<span class="tag w">not a legal scoring step</span>':""}</div>
 ${e.play?`<div style="margin-bottom:6px">${esc(e.play)}</div>`:""}
 <div class="big ${gold?"g":""}"><span class="away">${v(a.away)}</span><span class="dash">–</span><span class="home">${v(a.home)}</span></div>
 <div class="sub">away – home${e.delta?` · Δ ${esc(e.delta.away)} / ${esc(e.delta.home)}`:""}${e.score_before?` · before ${esc(sc(e.score_before))}`:""}</div>
 <div class="kv"><b>quarter · clock</b><span>Q${v(e.quarter)} · ${clk(e.clock_s)}</span><b>recording</b><span>${mmss(e.recording_s)}</span><b>wall time</b><span>${wall}</span>
 <b>confidence</b><span>${v(e.confidence)} <span class="sub">${esc(e.confidence_note||"")}</span><div class="conf"><i style="transform:scaleX(${Math.max(0,Math.min(1,+e.confidence||0))})"></i></div></span>
 <b>basis</b><span>${v(e.basis)}</span></div>`}
function chk(ok,title,body){const c=ok===true?["ok","✓"]:ok===false?["no","✗"]:["na","–"];
 return `<div class="chk"><span class="${c[0]}">${c[1]}</span><div><div>${title}</div>${body?`<div class="hx">${body}</div>`:""}</div></div>`}
function cpLine(x,label){if(!x)return chk(null,label+" checkpoint",MISS);
 const ok=x.frames_hash_matches_evidence;return chk(ok===true?true:ok===false?false:null,`${label} checkpoint #${esc(x.seq)} · frames_hash ${ok?"matches evidence":ok===false?"does not match":"unchecked"}`,`hash ${short(x.hash)}`)}
function rcCard(e){const ck=e.checkpoints||{},c=!nil(e.highlight)?CL[e.highlight]:null;
 const partial=RCPT.partial||[];const refNote=partial.find(x=>/referee/i.test(x))||(VERIFIED?"":"not signed by the QorTime referee");
 $("#rcCard").innerHTML=`<div class="h"><span class="lbl">Receipt &amp; verification</span><span class="tag ${STATUS==="FAIL"?"x":VERIFIED?"g":"w"}">${esc(STATUS||"missing")}</span></div>
 ${chk(VERIFIED?true:STATUS==="FAIL"?false:null,`Receipt: ${esc(RCPT.label||STATUS||"missing")}`,"")}
 ${(RCPT.errors||[]).length?`<ul class="errs">${RCPT.errors.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
 ${chk(VERIFIED?true:false,"Referee countersignature",esc(refNote))}
 ${cpLine(ck.before,"Before")}${cpLine(ck.after,"After")}
 ${c?chk(c.lock&&c.lock.in_receipt===true,`Clip lock #${esc(c.lock&&c.lock.seq)} ${c.lock&&c.lock.in_receipt?"is in the receipt":"is not in the receipt"}${VERIFIED?"":" · receipt is not a verified result"}`,`lock ${short(c.lock&&c.lock.hash)} · clip sha256 ${short(c.sha256)}`):chk(null,"Highlight clip",P0.footage_note?esc(P0.footage_note):"none for this moment")}
 ${chk(null,`Chain · ${v(CH.checkpoints)} checkpoints · ${v(CH.segments)} segments`,`head ${short(CH.chain_head)}`)}
 <div class="note">${RCPT.url?`<a href="${esc(RCPT.url)}">receipt.json</a> · `:""}<a href="${esc(RCPT.verify_url||"../../verify/")}">check it in the verifier</a></div>`}
function drawScope(){const e=S.ev,cv=$("#scope"),cx=cv.getContext("2d");const I=e&&e.inputs,s=I&&I.strip;
 const dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth||320,h=120;
 if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);
 cx.strokeStyle="rgba(130,170,210,.16)";for(let gx=0;gx<w;gx+=w/12){cx.beginPath();cx.moveTo(gx+.5,0);cx.lineTo(gx+.5,h);cx.stroke()}
 const mid=h*0.48;cx.beginPath();cx.moveTo(0,mid);cx.lineTo(w,mid);cx.stroke();
 cx.font="10px ui-monospace,Menlo,monospace";
 if(!s||!Array.isArray(s.presses)||!s.presses.length){cx.fillStyle="#f0a06a";cx.fillText("no inputs / haptics in the bundle for this moment",8,mid-6);
  $("#adv").textContent=IS.advisory||"Advisory evidence, not proof.";return}
 const n=s.presses.length,bw=w/n,mp=Math.max(1,...s.presses),he=s.haptic_energy||[],mh=Math.max(1,...he,1);
 cx.fillStyle="#3fe0d0";for(let i=0;i<n;i++){const ph=s.presses[i]/mp*(mid-16);if(ph>0)cx.fillRect(i*bw+1,mid-ph,Math.max(1,bw-2),ph)}
 cx.beginPath();for(let i=0;i<he.length;i++){const y=mid+6+(he[i]/mh)*(h-mid-16),xx=i*bw+bw/2;i?cx.lineTo(xx,y):cx.moveTo(xx,y)}
 cx.strokeStyle="#9fb2cc";cx.lineWidth=1.4;cx.stroke();
 const span=n*(s.bin_s||0.25),zx=((0-(s.t0_s||0))/span)*w;
 cx.strokeStyle="rgba(227,237,248,.45)";cx.setLineDash([3,3]);cx.beginPath();cx.moveTo(zx,0);cx.lineTo(zx,h);cx.stroke();cx.setLineDash([]);
 cx.fillStyle="#8b9bb0";cx.fillText("presses",6,12);cx.fillText("haptics",6,h-6);
 $("#adv").textContent=(IS.advisory||"Advisory evidence, not proof.")+" Device "+(IS.device||"not named")+"."}
function clipsCard(){const k=$("#clipsCard");
 if(!CL.length){k.innerHTML=`<div class="h"><span class="lbl">Highlight clips</span><span class="tag w">none</span></div><div class="sub">${esc(P0.footage_note||"No clips for this match. The stage plays burst stills, which are not continuous video.")}</div>`;return}
 k.innerHTML=`<div class="h"><span class="lbl">Highlight clips · ${CL.length}</span><span class="sub">tap a card · it opens in the player</span></div>
 <div class="cgrid">${CL.map((c,n)=>{const lk=c.lock||{};const seal=VERIFIED&&c.locked===true;
  return `<button class="clip" data-k="${n}"><span class="pv">${c.poster?`<img loading="lazy" decoding="async" alt="" src="${esc(c.poster)}">`:`<div class="phimg"></div>`}${seal?"":'<span class="cov">SCOREBUG LOCK</span>'}</span><div class="b"><span class="s ${seal?"g":""}">${esc(sc(lk.score_after)||"?")}</span> <span class="tag">${esc(lk.play||"")}</span>
  <div class="sub">Q${v(lk.quarter)} · ${clk(lk.clock_s)} · lock #${v(lk.seq)} · ${v(c.duration_s)}s</div>
  <div class="k">${lk.in_receipt?"lock is in the receipt":"lock is not in the receipt"} · receipt ${esc(STATUS||"?")}</div></div></button>`}).join("")}</div>
 ${VERIFIED?"":`<div class="note">These files were burned by qorcap highlights with a “LOCKED SCORE” panel before verification. This page covers that panel and the caption says SCOREBUG LOCK. The mp4 bytes are unchanged, so the manifest sha256 still matches. The burn text itself is set in qorcap <span class="mono">sidecar/qorcap_highlights.py</span>.</div>`}`;
 k.querySelectorAll(".clip").forEach(b=>b.onclick=()=>{const n=+b.dataset.k;const i=EV.findIndex(e=>e.highlight===n);S.flip=b.querySelector("img")||b;if(i>=0)select(i);else{const e=EV.find(ev=>ev.highlight===n);}})}
function foot(){const bits=[`<b>Claims.</b> ${esc(D.claims||"")}`,
 `<b>Missing in the bundle:</b> ${(D.missing||[]).length?(D.missing||[]).map(esc).join(" · "):"none listed"}`];
 if(P0.footage_note)bits.push(esc(P0.footage_note));
 bits.push("Per-frame scorebug reads and the scorebug crop box are not in the QorCap bundle yet, so “what the AI saw” is the frames the reader was given, tagged at the new-score frame. Keys ← → moments · Space play.");
 $("#foot").innerHTML=bits.join("<br>")}

/* ---------- select ---------- */
function select(i,first){if(!EV.length)return;i=Math.max(0,Math.min(EV.length-1,i));if(i===sel&&!first){S.flip=null;return}sel=i;const e=EV[i];S.ev=e;
 document.querySelectorAll("#mks .mk").forEach(b=>b.classList.toggle("sel",+b.dataset.i===i));
 document.querySelectorAll("#chips .chip").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("sel",on);b.setAttribute("aria-selected",on?"true":"false");if(on)hscroll($("#chips"),b)});
 document.querySelectorAll(".clip").forEach(b=>b.classList.toggle("sel",+b.dataset.k===e.highlight));
 const k=NAV.indexOf(i);$("#prv").disabled=k<=0;$("#nxt").disabled=k<0||k>=NAV.length-1;
 evCard(e);rcCard(e);strip(e);if($("#scopeCard").open)drawScope();
 S.clip=!nil(e.highlight)&&CL[e.highlight]?CL[e.highlight]:null;
 load(S.clip?"clip":"burst",!!first);preloadNext(i)}
function step(d){const k=NAV.indexOf(sel);const n=NAV[Math.max(0,Math.min(NAV.length-1,(k<0?0:k)+d))];if(!nil(n))select(n)}

/* scrub + swipe */
(()=>{const pr=$("#prog");let dn=false;const at=ev=>{const r=pr.getBoundingClientRect();return Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))};
 const go=p=>{if(S.mode==="clip"&&S.clip){const d=S.clip.duration_s||vid.duration||1;vid.currentTime=p*d;vtime(vid.currentTime||0)}else if(S.fr&&S.fr.length)showFrame(Math.round(p*(S.fr.length-1)),false)};
 pr.addEventListener("pointerdown",ev=>{dn=true;pause();try{pr.setPointerCapture(ev.pointerId)}catch(e){}go(at(ev))});
 pr.addEventListener("pointermove",ev=>{if(dn)go(at(ev))});
 pr.addEventListener("pointerup",()=>dn=false);pr.addEventListener("pointercancel",()=>dn=false);
 pr.addEventListener("keydown",ev=>{if(ev.key!=="ArrowRight"&&ev.key!=="ArrowLeft")return;ev.stopPropagation();ev.preventDefault();pause();
  if(S.mode==="clip"&&S.clip){vid.currentTime=Math.max(0,Math.min(S.clip.duration_s||0,(vid.currentTime||0)+(ev.key==="ArrowRight"?0.4:-0.4)));vtime(vid.currentTime||0)}
  else showFrame(S.i+(ev.key==="ArrowRight"?1:-1),false)})})();
(()=>{const tl=$("#tl");let dn=null;
 tl.addEventListener("pointerdown",ev=>{if(ev.target.closest(".mk,.crackbtn"))return;dn={x:ev.clientX,id:ev.pointerId};pause()});
 tl.addEventListener("pointermove",ev=>{if(!dn)return;const r=tl.getBoundingClientRect();setRec(Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*DUR,true)});
 const up=ev=>{if(!dn)return;dn=null;const r=tl.getBoundingClientRect();const t=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*DUR;
  let b=NAV[0],bd=1e15;NAV.forEach(i=>{const d=Math.abs((EV[i].recording_s||0)-t);if(d<bd){bd=d;b=i}});if(!nil(b))select(b)};
 tl.addEventListener("pointerup",up);tl.addEventListener("pointercancel",()=>dn=null)})();
(()=>{let sw=null;$("#stage").addEventListener("pointerdown",ev=>{if(ev.target.closest("button"))return;sw={x:ev.clientX,y:ev.clientY}});
 $("#stage").addEventListener("pointerup",ev=>{if(!sw)return;const dx=ev.clientX-sw.x,dy=ev.clientY-sw.y;sw=null;
  if(Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.25)step(dx<0?1:-1)})})();

/* ---------- boot ---------- */
function boot(){const st=$("#status");
 const SHORT={FAIL:"Receipt FAIL · not a verified result",SELF_ATTESTED:"Self-attested · not referee-signed",PARTIAL:"Partial · not a verified result",VERIFIED:"Verified by the referee"};
 st.textContent=SHORT[STATUS]||STATUS||"receipt status missing";st.title=RCPT.label||"";st.classList.add(STATUS==="FAIL"?"fail":VERIFIED?"ok":"warn");
 $("#mid").textContent=`${D.match_id||""} · qorcap ${D.qorcap_version||"?"}`;
 document.title=`QorTime · ${D.match_id||"match"}`;
 if(!RAIL)RAIL=sparseRail();
 if(RAIL){CRACKS=new Set((RAIL.cracks||[]).map(c=>c.i));$("#railCard").classList.toggle("seal",!!RAIL.seal);
  const why=(RAIL.cracks||[]).map(c=>`#${c.i} ${c.why}`).join(" · ");
  $("#railSub").textContent=`${RAIL.n} links${RAIL.dt_s?` · ~${RAIL.dt_s}s each`:""} · ${RAIL.note||""}${why?` · cracked ${why}`:""}`}
 DUR=(VD.recording_duration_s||VD.duration_s||Math.max(1,...EV.map(e=>e.recording_s||0),1));
 MAXS=Math.max(7,...EV.map(e=>e.score_after?Math.max(e.score_after.away||0,e.score_after.home||0):0));
 NAV=EV.map((e,i)=>i).filter(i=>["score_change","kickoff","end_of_game"].includes(EV[i].kind)&&!nil(EV[i].recording_s));
 const R=D.result||{};
 const fin=R.final&&R.final_confirmed?`final ${R.final.away}–${R.final.home}${VERIFIED?" · referee-verified":" · confirmed in the recording, not referee-signed"}`:"";
 if(!$("#railSub").textContent)$("#railSub").textContent=fin;
 else if(fin)$("#railSub").textContent=$("#railSub").textContent;
 drawWorm();chips();clipsCard();foot();drawMacro();
 const nScore=NAV.filter(i=>EV[i].kind==="score_change").length;
 const head=$("#railCard").querySelector(".lbl");
 if(head)head.insertAdjacentHTML("afterend",`<span class="tag a">${nScore} score changes · ${mmss(DUR)}</span>`);
 $("#prv").onclick=()=>step(-1);$("#nxt").onclick=()=>step(1);
 $("#play").onclick=()=>S.timer||(S.mode==="clip"&&!vid.paused)?pause():play();
 $("#scopeCard").addEventListener("toggle",()=>{if($("#scopeCard").open)drawScope()});
 addEventListener("keydown",ev=>{if(ev.target.closest("input,textarea"))return;if(ev.key==="ArrowRight"){step(1);ev.preventDefault()}
  else if(ev.key==="ArrowLeft"){step(-1);ev.preventDefault()}else if(ev.key===" "){ev.preventDefault();$("#play").click()}});
 addEventListener("resize",()=>{placeMarkers();paintPH();drawMacro();if(winCount()!==S.win){S.ci=null;renderChain(PH.x*DUR,false)}});
 ticker({away:0,home:0},null,false);
 const first=NAV.find(i=>EV[i].kind==="score_change");
 requestAnimationFrame(()=>{document.body.classList.add("ready");select(nil(first)?(NAV[0]||0):first,true)});
 if(RM)$("#chainClip").classList.add("booted")}
boot();
})();
</script></body></html>
