name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "verify/**", "schema/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site/verify _site/schema && cp -r site/. _site/ && rm -f _site/assets/og.svg && cp -r verify/. _site/verify/ && rm -f _site/verify/test.mjs _site/verify/adversarial.test.mjs && cp schema/*.json _site/schema/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
