name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,vision]"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ruff check .
      - run: pytest -q
      - name: CLI round trip
        run: |
          qor-receipt emit --demo /tmp/r.json > /tmp/out.json
          qor-receipt verify /tmp/r.json --referee-pub "$(python -c "import json;print(json.load(open('/tmp/out.json'))['referee_pub'])")"
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node verify/test.mjs
      - run: npm ci
        working-directory: services/verified-match
      - run: npm test
        working-directory: services/verified-match
