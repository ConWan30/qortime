[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qor-receipt"
version = "0.1.0"
description = "Signed, verified match-result receipts for console money-match platforms"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
referee = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
vision = ["numpy>=1.26", "opencv-python-headless>=4.9"]
agent = ["numpy>=1.26", "opencv-python>=4.9", "hidapi>=0.14", "httpx>=0.27", "fastapi>=0.110", "pygrabber>=0.2; sys_platform == 'win32'"]
dev = ["pytest>=8", "jsonschema>=4", "fastapi>=0.110", "httpx>=0.27", "ruff>=0.5", "opencv-python-headless==5.0.0.93"]

[project.scripts]
qor-receipt = "qor_receipt.cli:main"
qortime = "qor_receipt.cli:main"

[tool.setuptools.packages.find]
include = ["qor_receipt*"]

[tool.setuptools.package-data]
"*" = ["*.npz", "*.md", "*.jpg", "*.png", "*.json", "*.html"]
"qor_receipt.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "known_gap: documents a current detection gap; assertions match today's rule and stay green in CI",
]

[tool.ruff]
line-length = 130
extend-exclude = ["qor_receipt/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E702"]
