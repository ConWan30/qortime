<!-- Copy-paste Footer (Watch active example).
     Edit data-watch-href in ONE spot here when the Watch URL is finalized. -->
<footer
  class="qor-footer"
  data-qor-footer
  data-active="watch"
  data-receipts-href="https://qortime.com"
  data-capture-href="https://qortime.com/cap"
  data-watch-href="#watch-coming-soon"
>
  <div class="qor-footer__inner">
    <div class="qor-footer__top">
      <div class="qor-footer__brand-col">
        <a class="qor-footer__brand" href="/">
          <span class="qor-footer__mark">
            <img src="brand/logo-icon.svg" alt="" width="26" height="26" />
          </span>
          <span>QorTime</span>
        </a>
        <p class="qor-footer__tagline">
          Skill-proof match telemetry, local capture, and self-hosted streams.
        </p>
      </div>

      <nav class="qor-footer__nav" aria-label="Qor family footer">
        <a class="qor-footer__link" data-qor-link="receipts" href="https://qortime.com">Receipts</a>
        <a class="qor-footer__link" data-qor-link="capture" href="https://qortime.com/cap">Capture</a>
        <a class="qor-footer__link" data-qor-link="watch" href="#watch-coming-soon" aria-current="page">Watch</a>
      </nav>
    </div>

    <div class="qor-footer__bottom">
      <p class="qor-footer__record-line">
        <span class="qor-footer__record-dot" aria-hidden="true"></span>
        <span>Fair-proof record format across Receipts, Capture, and Watch</span>
      </p>
      <div class="qor-footer__legal">Self-hosted software. Fair-proof match records.</div>
    </div>
  </div>
</footer>
