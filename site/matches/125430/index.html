 <div class="sub"><span>away – home</span>${e.delta?`<span class="mono">Δ ${esc(e.delta.away)} / ${esc(e.delta.home)}</span>`:''}</div>
 <div class="kv"><b>before</b><span>${v(sc(e.score_before))}</span><b>quarter · clock</b><span>Q${v(e.quarter)} · ${v(clk(e.clock_s))}</span>
 <b>wall time</b><span>${nil(e.t_ms)?M:esc(new Date(e.t_ms).toISOString().replace('T',' ').replace('Z',' UTC'))}</span><b>recording</b><span>${nil(e.recording_s)?M:esc(e.recording_s)+' s'}</span>
 ${nil(e.pre_roll_s)?'':`<b>burst</b><span>from ${esc(e.pre_roll_s)} s before the event${e.pre_roll_s>3.5?' (pre-roll back to the last read of the old score, to cover the scoring play)':''}</span>`}<b>confidence</b><span>${v(e.confidence)} <span style="color:var(--dim)">${v(e.confidence_note)}</span></span><b>basis</b><span>${v(e.basis)}</span>
 ${e.kind==='end_of_game'?`<b>final confirmed</b><span>${e.final_confirmed?'yes':'<span class="miss">no</span>'}</span><b>method</b><span>${v(e.final_method)}</span>`:''}</div>`;
 if(!nil(e.highlight)&&HL[e.highlight]){s.insertAdjacentHTML('beforeend',`<button class="cbtn" id="cbtn"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>Watch the verified clip</button>`);$('#cbtn').addEventListener('click',()=>openClip(e.highlight))}
 flipScore($('#bigs'),e.score_before||(isScore?{away:0,home:0}:after),after);
 if(gold&&!RM){const b=$('#bigs');requestAnimationFrame(()=>b.classList.add('go'))}
 const c=e.checkpoints||{};$('#chtag').innerHTML=c.trigger_match?'<span class="tag a">trigger checkpoint found</span>':'';
 $('#chain').innerHTML=cp(c.trigger_match,'trigger')+cp(c.before,'before')+cp(c.after,'after')+
 `<div class="kv"><b>clip</b>${c.clip?`<span class="mono">${esc(c.clip.name)}<br><span class="hx" data-x="${esc(c.clip.sha256??'')}"></span></span>`:M}<b>chain head</b><span class="mono hx" data-x="${esc(CH.chain_head??'')}"></span></div>`;
 document.querySelectorAll('#chain .hx').forEach((el,k)=>{const x=el.dataset.x;setTimeout(()=>decrypt(el,x||null,650),RM?0:120+k*90)});
 const I=e.inputs;$('#adv').innerHTML=`<b style="color:var(--ink)">Advisory evidence, not proof.</b> ${v(IS.advisory||(I&&I.advisory))}<br>${I?`${(I.presses||[]).length} presses, ${(I.haptics||[]).length} haptic events in the window shown. Bundle label: ${v(IS.human_label)} (${v(IS.human_permille)}‰, advisory) · device ${v(IS.device)}.`:M+' — no inputs/haptics for this event'}`;
 runScope(I)}

/* ---------- selection with shared-element transition ---------- */
function apply(i){const e=EV[i];S.sel=i;$('#prv').disabled=i<=0;$('#nxt').disabled=i>=EV.length-1;mks.forEach((m,j)=>{m.classList.toggle('sel',j===i);m.setAttribute('aria-current',j===i?'true':'false')});
 track.setAttribute('aria-valuenow',String(i+1));track.setAttribute('aria-valuetext',`${lab(e)} (${e.kind.replace(/_/g,' ')})`);
 $('#eid').textContent=e.id||'';$('#cuts').innerHTML=e.cuts_video_s&&e.cuts_video_s.length?`<span class="tag">${e.cuts_video_s.length} cuts</span>`:'';
 declutter();side(e);loadFrames(e)}
function select(i){if(!EV.length)return;i=Math.max(0,Math.min(EV.length-1,i));S.target=fx(F[i]);kick();if(i===S.sel)return;
 const st=$('#stage'),bs=$('#score');
 if(!RM&&!LITE&&document.startViewTransition&&S.sel>=0){st.style.viewTransitionName='stage';bs.style.viewTransitionName='scorecard';document.startViewTransition(()=>apply(i))}
 else apply(i)}
addEventListener('keydown',ev=>{if(ev.target.closest('input,button,#track')&&!/^[\[\],.]$/.test(ev.key)&&ev.key!==' ')return;
 if(ev.key==='ArrowRight'){select(S.sel+1)}else if(ev.key==='ArrowLeft'){select(S.sel-1)}else if(ev.key===']'||ev.key==='.'){stop();paintFrame(FB.i+1)}else if(ev.key==='['||ev.key===','){stop();paintFrame(FB.i-1)}
 else if(ev.key===' '&&!ev.target.closest('button,input')){ev.preventDefault();FB.timer?stop():play(false)}});

$('#foot').innerHTML=`<b>Claims.</b> ${v(D.claims)}<br><b>Missing in bundle:</b> ${(D.missing||[]).length?(D.missing).map(esc).join(' · '):'none listed'} · video ${v(VD.file)} (${v(VD.alignment)}) · ${v(VD.alignment_note)}<br>
 Gold marks only locked/confirmed scores; aqua marks reads that are not locked. Times shown as UTC. Keys: <kbd>←</kbd><kbd>→</kbd> events · <kbd>[</kbd><kbd>]</kbd> frames · <kbd>Space</kbd> play burst.`;

/* ---------- intro: seal the chain ---------- */
function start(){const h=e=>e.frames&&e.frames.length;let k=EV.findIndex(e=>e.kind==='score_change'&&e.locked&&h(e));if(k<0)k=EV.findIndex(e=>e.kind==='score_change'&&h(e));if(k<0)k=EV.findIndex(e=>e.kind==='score_change');
 S.x=0;W=track.clientWidth;document.body.classList.add('in');setTimeout(()=>select(Math.max(0,k)),RM?0:250);
 const f=$('#final'),fs=$('#fsc');if(fs){if(f._s){flipScore(fs,{away:0,home:0},f._s);if(R.final_confirmed===true&&!RM)setTimeout(()=>fs.classList.add('go'),300)}else fs.innerHTML=M}}
const intro=$('#intro');
if(RM||!EV.length){intro.remove();start()}else{
 const svg=$('#isvg'),N=Math.max(2,Math.min(22,CH.checkpoints||EV.length+1)),gap=760/(N-1);let g='',dl=0;
 for(let i=0;i<N;i++){const x=20+i*gap,y=60+Math.sin(i*.9)*14;
  if(i){const px=20+(i-1)*gap,py=60+Math.sin((i-1)*.9)*14,l=Math.hypot(x-px,y-py);g+=`<path class="ln" d="M${px} ${py}L${x} ${y}" style="--l:${l.toFixed(1)};animation-delay:${dl}ms"/>`}
  g+=`<circle class="nd" cx="${x}" cy="${y}" r="${i===N-1?7:4.5}" style="animation-delay:${dl+(i?160:0)}ms"/>`;dl+=62}
 const sx=20+(N-1)*gap,sy=60+Math.sin((N-1)*.9)*14;
 g+=`<g class="seal" style="animation-delay:${dl+150}ms"><circle cx="${sx}" cy="${sy}" r="16" fill="none" stroke="#3fe0d0" stroke-width="1.5" opacity=".7"/><path d="M${sx-5} ${sy}l3.5 3.5 7-7" fill="none" stroke="#3fe0d0" stroke-width="2" stroke-linecap="round"/></g>`;
 svg.innerHTML=g;$('#it1').textContent=`sealing hash chain · ${CH.checkpoints??'?'} checkpoints · ${CH.segments??'?'} segments`;
 setTimeout(()=>decrypt($('#it2'),CH.checkpoint_head??null,900),300);
 let done=false;const fin=()=>{if(done)return;done=true;intro.classList.add('out');start();setTimeout(()=>intro.remove(),800)};
 setTimeout(fin,dl+1500);addEventListener('keydown',fin,{once:true});intro.addEventListener('click',fin)}
})();
